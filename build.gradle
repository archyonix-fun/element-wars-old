plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.8.21'
}

group = 'fun.archyonix'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.hypera.dev/snapshots' }
}

dependencies {
    implementation 'net.minestom:minestom-snapshots:' + minestomVersion
    implementation 'io.github.cdimascio:dotenv-java:' + dotenvVersion
    implementation 'org.bspfsystems:yamlconfiguration:' + yamlVersion
    implementation "dev.hypera:Scaffolding:" + scaffoldingVersion
    implementation 'com.syntaxphoenix.syntaxapi:nbt:2.0.13'



    // Dev
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    // Test
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

test {
    useJUnitPlatform()
}

compileKotlin {
    kotlinOptions.jvmTarget = '1.8'
}

compileTestKotlin {
    kotlinOptions.jvmTarget = '1.8'
}