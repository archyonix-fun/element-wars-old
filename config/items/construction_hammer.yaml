id: "CONSTRUCTION_HAMMER"
union: "build_tool"
default:
  material: "minecraft:wooden_pickaxe"
  recharge: 30
  flags:
    - "TOOL"
  properties:
    extractorMultiplier: 1
  actions:
    build_menu:
      executor: "UI_OPEN"
      properties:
        path: "config/ui/build-menu.yaml"
      trigger:
        DEFAULT?OR:
          RIGHT_CLICK: false
          RIGHT_CLICK_BLOCK: false
    build_walls:
      executor: "STRUCTURE_WALLS_PLACE"
      trigger:
        action-build: true
    extract:
      executor: "RESOURCE_EXTRACT"
      trigger:
        action-build: true
        BLOCK_BREAK: false


variants:
  T0:
    name: "<t0>Примитивный молот строителя"
    description:
      - "<text>Важнейший инструмент для любой колонии. Способен возвести"
      - "<text>все здания и даже добыть некоторые ресурсы."
      - "<blue>Скорость строительства: <text>1"
    icon: "construction_hammer_t0"
    actions:
      build:
        executor: "STRUCTURE_BUILD"
        properties:
          buildPower: 1
        trigger:
          DEFAULT?OR:
            LEFT_CLICK_BLOCK: false
            BLOCK_BREAK: false
