id: "TOWER"
area:
  height: 8
  size: 12
grid: 12
buildingLimit: 0
controllers:
  EXTENSIONS:
    NORTH_WEST:
      startPoint: "0:0:0"
      endPoint: "3:5:3"
    NORTH:
      startPoint: "4:0:3"
      endPoint: "7:5:3"
    EAST_NORTH:
      startPoint: "8:0:3"
      endPoint: "11:5:3"
    EAST:
      startPoint: "8:0:4"
      endPoint: "11:5:7"
    SOUTH_EAST:
      startPoint: "8:0:8"
      endPoint: "11:5:11"
    SOUTH:
      startPoint: "4:0:8"
      endPoint: "7:5:11"
    WEST_SOUTH:
      startPoint: "0:0:8"
      endPoint: "3:5:11"
    WEST:
      startPoint: "0:0:4"
      endPoint: "3:5:7"
  WALLS:
    samples:
      WALL_STRAIGHT:
        schema: "$wallStraightSchema"
        gateConfig:
          schema: "$gateStraightSchema"
          block: "$gateBlock"
          openDistance: 3
          region:
            startPoint: "3:0:1"
            endPoint: "4:2:2"
      WALL_SLOPE:
        schema: "$wallSlopeSchema"
    places:
      NORTH_WEST:
        extension: "NORTH_WEST"
        sample: "WALL_SLOPE"
      NORTH:
        extension: "NORTH"
        sample: "WALL_STRAIGHT"
      EAST_NORTH:
        extension: "EAST_NORTH"
        sample: "WALL_SLOPE"
      EAST:
        extension: "EAST"
        sample: "WALL_STRAIGHT"
      SOUTH_EAST:
        extension: "SOUTH_EAST"
        sample: "WALL_SLOPE"
      SOUTH:
        extension: "SOUTH"
        sample: "WALL_STRAIGHT"
      WEST_SOUTH:
        extension: "WEST_SOUTH"
        sample: "WALL_SLOPE"
      WEST:
        extension: "WEST"
        sample: "WALL_STRAIGHT"

variants:
  WOOD_TOWER:
    name: "Деревянная башня"
    buildPoints: 5
    schema: "wood_tower.schem"
    cost:
      NATURAL_CRYSTAL: 50
    properties:
      wallStraightSchema: "wood_wall-straight.schem"
      gateStraightSchema: "wood_gate.schem"
      gateBlock: "wood_wall-slope.schem"
      wallSlopeSchema: "wood_wall-slope.schem"