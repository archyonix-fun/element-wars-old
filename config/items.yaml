bmb-tool:
  displayName: "◈ Построить главное здание"
  lore:
    - "ПКМ по земле создает главное здание"
    - "и дает начало поселению Вашей команды."
    - "ПРЕДМЕТ МОЖЕТ БЫТЬ ИСПОЛЬЗОВАН ЛИШЬ РАЗ!"
  material: "minecraft:stick"
  actions:
    CREATE_STRUCTURE:
      trigger: "RIGHT_CLICK"
      data:
        structureId: "main-base"
    REMOVE_ITEM:
      trigger: "RIGHT_CLICK"
      data:
        target: "THIS"

construction-hammer:
  displayName: "Строительный молот"
  material: "minecraft:wooden_pickaxe"